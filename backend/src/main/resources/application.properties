spring.application.name=expense-tracker
# 'dev' unless SPRING_PROFILES_ACTIVE is set (docker-compose sets it to 'prod')
spring.profiles.default=dev
server.port=${PORT:8080}

# Flyway owns the schema; Hibernate must not touch it
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JSON
spring.jackson.default-property-inclusion=always

# CORS (only needed when the frontend calls the API directly, e.g. Vite dev server)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# Actuator / Swagger
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.path=/swagger-ui.html
