server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # REST API + docs are proxied to the Spring Boot container
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /swagger-ui { proxy_pass http://backend:8080; }
    location /v3/api-docs { proxy_pass http://backend:8080; }
    location /actuator/health { proxy_pass http://backend:8080; }

    # Hashed build assets can be cached for a long time
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # React Router: always fall back to index.html
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
